name: flutter_application_1
# The package name stays flutter_application_1 on purpose: data folders,
# bundle ids and channel names depend on it (see README.md, "Naming").
description: "misc. - notes, mindmaps, calendar and an archive, synced through your own hub."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# No Flutter plugins: native calls go through dart:ffi (Windows) and the
# app's own method channel (iOS), so the project builds without Windows
# Developer Mode.
dependencies:
  flutter:
    sdk: flutter

  ffi: ^2.2.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/motivation/quotes.json
    - assets/motivation/greetings.json

