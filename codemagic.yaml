      - build/ios/iphoneos/THEapp-unsigned.ipa
      - build/ios/iphoneos/THEapp-with-widgets.ipa
      - /tmp/xcodebuild_logs/*.log

  # Signed, installable IPA. Needs a PAID Apple Developer Program membership
  # (App Groups and distribution certificates are not available to free
  # Apple IDs). Nothing secret is in this file: Codemagic supplies it from
  # the environment group "theapp_signing" (Team settings → Environment
  # variables), which must contain:
  #   APP_STORE_CONNECT_ISSUER_ID       App Store Connect API key issuer id
  #   APP_STORE_CONNECT_KEY_IDENTIFIER  the API key id
  #   APP_STORE_CONNECT_PRIVATE_KEY     contents of the AuthKey_XXXX.p8 file
  #   CERTIFICATE_PRIVATE_KEY           an RSA private key (PEM) for the
  #                                     distribution certificate
  # All three bundle ids (com.amaterasu.theapp, .widget and .share)
  # must have the App Group group.com.theapp.shared enabled in the Apple
  # Developer portal; the profiles are then created/fetched automatically.
  ios-signed:
    name: THEapp iOS (signed IPA, Apple Developer Program)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      groups:
        - theapp_signing
      vars:
        # ad hoc = install on registered devices; use IOS_APP_STORE for
        # TestFlight / App Store instead.
        PROFILE_TYPE: IOS_APP_ADHOC
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up code signing (main app and widget)
        script: |
          set -e
          keychain initialize
          for id in com.amaterasu.theapp com.amaterasu.theapp.widget com.amaterasu.theapp.share; do
            app-store-connect fetch-signing-files "$id" \
              --type "$PROFILE_TYPE" --create
          done
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=THEAPP_BUILD=$(git rev-parse --short HEAD) 2>&1 \
            | tee /tmp/flutter_build_ipa.log
          test "${PIPESTATUS[0]}" -eq 0
          ls -la build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/flutter_build_ipa.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
